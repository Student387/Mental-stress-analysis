{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card shadow-sm border-0 mb-4 mt-4">
            <div class="card-body">
                <h4 class="text-center mb-4" style="font-family: sans-serif; color: #333;">Ranked Factors Affecting Student Stress Level</h4>
                
                <div style="height: 850px; position: relative;">
                    <canvas id="globalImportanceChart"></canvas>
                </div>
            </div>
        </div>
        <div class="text-center mb-5">
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
        </div>
    </div>
</div>

<script id="importance-data-block" type="application/json">
    {{ importance_data | tojson | safe }}
</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const rawData = document.getElementById('importance-data-block').textContent;
    const data = JSON.parse(rawData);
    
    const labels = data.map(item => item.name);
    const values = data.map(item => item.value);

    const ctx = document.getElementById('globalImportanceChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                data: values,
                backgroundColor: '#2b7bba',
                borderColor: '#1a5a8a',
                borderWidth: 1,
                barThickness: 22
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return ` Importance: ${context.raw}%`;
                        }
                    }
                }
            },
            scales: {
                x: {
                    beginAtZero: true,
                    max: 20, // Set slightly above our max value (18.42)
                    title: { 
                        display: true, 
                        text: 'Relative Importance (%)', 
                        font: { size: 14, weight: 'bold' } 
                    },
                    ticks: {
                        callback: function(value) { return value + '%'; }
                    }
                },
                y: {
                    title: { 
                        display: true, 
                        text: 'Stress Factors', 
                        font: { size: 14, weight: 'bold' } 
                    }
                }
            }
        }
    });
});
</script>
{% endblock %}
