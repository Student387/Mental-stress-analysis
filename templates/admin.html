{% extends "base.html" %}
{% block title %}Admin - Model Performance{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h2 class="mb-4"><i class="bi bi-speedometer2 text-theme-primary me-2"></i>Model Performance</h2>
        {% if metrics %}
        <div class="card shadow-sm border-0 mb-4">
            
                    </div>
                </div>
            </div>
        </div>

<div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white py-3">
        <h5 class="mb-0 text-theme-primary"><i class="bi bi-diagram-3 me-2"></i>Global Feature Importance</h5>
    </div>
    <div class="card-body">
        <div style="height: 400px;">
            <canvas id="adminImportanceChart"></canvas>
        </div>
    </div>
</div>

<script id="admin-importance-data" type="application/json">
    {{ feature_importance | tojson | safe }}
</script>
{% endif %}
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-theme">Back to Dashboard</a>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    let importanceData = {};
    try {
        const dataElement = document.getElementById('admin-importance-data');
        if (dataElement) {
            importanceData = JSON.parse(dataElement.textContent.trim());
        }
    } catch (e) {
        console.error("Error parsing importance data:", e);
    }

    if (Object.keys(importanceData).length > 0) {
        const ctx = document.getElementById('adminImportanceChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: Object.keys(importanceData),
                datasets: [{
                    label: 'Impact Weight (%)',
                    data: Object.values(importanceData),
                    backgroundColor: 'rgba(30, 90, 142, 0.7)',
                    borderColor: '#1e5a8e',
                    borderWidth: 1,
                    borderRadius: 5
                }]
            },
            options: {
                indexAxis: 'y', // Makes it a horizontal bar chart
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: { 
                        beginAtZero: true, 
                        max: 100,
                        title: { display: true, text: 'Relative Importance Score' }
                    }
                }
            }
        });
    }
});
</script>
{% endblock %}
